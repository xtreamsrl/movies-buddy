[project]
name = "movies-buddy"
version = "0.1.0"
description = "A step-by-step guide to build your first RAG application!"
readme = "README.md"
authors = [
    { name = "Luca Baggi", email = "luca.baggi@xtreamers.io" },
    { name = "Fabio Lipreri", email = "fabio.lipreri@xtreamers.io" }
]
requires-python = ">=3.11"

dependencies = [
  "sentence-transformers>=3.0.1",
  "pandas[pyarrow]>=2.2.2",
  "tqdm>=4.66.4",
  "plotly>=5.22.0",
  "umap-learn>=0.5.6",
  "qdrant-client>=1.9.2",
  "openai>=1.35.3",
  "numpy<2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit-uv>=4.1.4",
    "jupyterlab>=4.3.4",
]

[tool.ruff.lint]
extend-select = ["ALL"]
extend-ignore = [
  "PD",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
exclude = [
  ".venv"
]
venvPath = "."
venv = ".venv"
reportUnusedCallResult = false
reportUnknownMemberType = false

[build-system]
requires = [ "setuptools >= 40.9.0" ]
build-backend = "setuptools.build_meta"
